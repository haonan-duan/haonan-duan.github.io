# Site settings
title                         : "Haonan Duan"
description                   : "🤖🍣✈️🚃🏎️🌁🍦"

# Author
author:
  name           : "Haonan Duan"
  avatar         : "images/haonan.png"
  bio            : "Robotics Learner"
  location       : "Shanghai, China"
  googlescholar  : "https://scholar.google.com/citations?user=4zO4UlcAAAAJ"
  email          : "duan.haonan10@gmail.com"
  github         : "haonan-duan"
  linkedin       : "haonan-duan"

# File handling
include:
  - _pages
exclude:
  - .bundle
  - .github
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - run_server.sh
  - vendor

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Default layout for pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
