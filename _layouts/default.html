---
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.className += ' js';</script>

  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <title>{{ site.author.name }}{% if page.title and page.title != "" %} · {{ page.title }}{% endif %}</title>

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.author.name }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/images/haonan.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
  <meta name="theme-color" content="#fbf9fe">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body data-author-email="{{ site.author.email }}">
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="shell">
    {% include profile-card.html %}
    <main class="main" role="main">
      {{ content }}
    </main>
  </div>

  <footer class="footer">
    <p class="footer__count">visitors · <b id="visitor-count" aria-live="polite">—</b></p>
    <p>built with <a href="https://claude.com/claude-code">claude code</a></p>
  </footer>

  {% include analytics.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
